        .kr-word {

            from { opacity: 0; transform: translateY(6px) scale(0.98); }

                const mouth = new THREE.Mesh(new THREE.TorusGeometry(expr === "Ngạc nhiên" ? 0.045 : 0.055, 0.015, 8, 16, expr === "Ngạc nhiên" ? Math.PI * 2 : Math.PI), new THREE.MeshBasicMaterial({ color: 0xe11d48 }));
                mouth.rotation.x = Math.PI;
                mouth.position.set(0, -0.15, 0.51);
                headGroup.add(mouth);
                root.add(headGroup);

                const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.35, 0.62, 20), topMat);

                const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.48, 12), topMat);

                const fs = av.garments?.fullset || "f_none";

                if (!isPants) {

                    skirt.position.y = isLong ? -0.46 : -0.32;

                    const sash = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.045, 10, 22), outMat);
                    sash.rotation.x = Math.PI / 2;

                [-0.14, 0.14].forEach(sx => {

                const hw = av.garments?.headwear || "h_none";
                if (hw !== "h_none") {

                            ear.rotation.z = ex < 0 ? 0.2 : -0.2;

                    } else {

                if (av.garments?.jewelry === "j_glasses") {

                        const lens = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.015, 8, 18), outMat);
                        lens.position.set(gx, 0.88, 0.54);
                        root.add(lens);

                const oa = av.garments?.otherAcc || "o_none";
                if (oa.startsWith("o_wings")) {
                    [-0.48, 0.48].forEach(wx => {
                        const wing = new THREE.Mesh(new THREE.SphereGeometry(0.36, 14, 14), outMat);
                        wing.scale.set(1.25, 0.75, 0.1);
                        wing.position.set(wx, 0.16, -0.34);
                        root.add(wing);
                    });
                }
                if (oa === "o_tail") {
                    const tail = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 14), outMat);
                    tail.scale.set(0.8, 1.2, 1.5);
                    tail.position.set(0, -0.35, -0.58);
                    root.add(tail);
                }
                if (oa.startsWith("o_handheld")) {
                    const prop = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.3, 0.06), outMat);
                    prop.position.set(0.52, -0.05, 0.24);
                    root.add(prop);
                }
                if (oa === "o_aura") {
                    for (let i = 0; i < 6; i++) {
                        const ang = (i / 6) * Math.PI * 2;
                        const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.065, 0), outMat);
                        star.position.set(Math.cos(ang) * 0.85, 0.1 + (i % 3) * 0.35, Math.sin(ang) * 0.85);
                        root.add(star);
                    }
                }

                root.userData = { headGroup, leftArm, rightArm, leftLeg, rightLeg };
                return root;
            },

            mountScene(canvasId, mode = "pet") {
                const canvas = document.getElementById(canvasId);
                if (!canvas || !window.THREE) return;
                if (this.scenes[canvasId]?.raf) cancelAnimationFrame(this.scenes[canvasId].raf);

                const w = canvas.clientWidth || 320;
                const h = canvas.clientHeight || 280;
                const lowPower = this.isLowPowerDevice();

                const renderer = new THREE.WebGLRenderer({ canvas, antialias: !lowPower, alpha: true, preserveDrawingBuffer: true });
                renderer.setSize(w, h, false);
                renderer.setPixelRatio(lowPower ? 1 : Math.min(window.devicePixelRatio || 1, 2));

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
                camera.position.set(0, 0.52, mode === "dual" ? 4.4 : 3.4);

                const lightHex = mode === "dual" ? (window.State.room.lightColor || "#ffffff") : "#ffffff";
                scene.add(new THREE.AmbientLight(lightHex, 0.82));
                const dir = new THREE.DirectionalLight(0xffffff, 0.92);
                dir.position.set(3, 5, 4);
                scene.add(dir);

                const root = new THREE.Group();
                let avatarRef = null;
                let petRef = null;

                if (mode === "pet") {
                    petRef = this.buildPetMesh(window.State.pet);
                    root.add(petRef);
                } else if (mode === "avatar") {
                    avatarRef = this.buildAvatarMesh(window.State.avatar3d);
                    root.add(avatarRef);
                } else {
                    const floor = new THREE.Mesh(
                        new THREE.CylinderGeometry(2.35, 2.35, 0.12, 32),
                        new THREE.MeshStandardMaterial({ color: window.State.room.floorColor || "#3f2e21", roughness: 0.7 })
                    );
                    floor.position.y = -0.92;
                    root.add(floor);

                    avatarRef = this.buildAvatarMesh(window.State.avatar3d);
                    avatarRef.position.x = -0.65;
                    petRef = this.buildPetMesh(window.State.pet);
                    petRef.scale.setScalar(0.78);
                    petRef.position.set(0.78, -0.14, 0.18);
                    root.add(avatarRef, petRef);
                }
                scene.add(root);

                let dragging = false, prevX = 0;
                const onStart = (x) => { dragging = true; prevX = x; };
                const onMove = (x) => {
                    if (!dragging) return;
                    root.rotation.y += (x - prevX) * 0.012;
                    prevX = x;
                };
                canvas.onmousedown = (e) => onStart(e.clientX);
                window.addEventListener("mouseup", () => { dragging = false; });
                canvas.onmousemove = (e) => onMove(e.clientX);
                canvas.ontouchstart = (e) => { if (e.touches[0]) onStart(e.touches[0].clientX); };
                canvas.ontouchend = () => { dragging = false; };
                canvas.ontouchmove = (e) => { if (e.touches[0]) onMove(e.touches[0].clientX); };
                canvas.onwheel = (e) => {
                    e.preventDefault();
                    camera.position.z = Math.max(1.8, Math.min(6.8, camera.position.z + (e.deltaY > 0 ? 0.25 : -0.25)));
                };

                const entry = { renderer, scene, camera, root, avatarRef, petRef, actionUntil: 0 };
                const animate = () => {
                    entry.raf = requestAnimationFrame(animate);
                    const t = performance.now() * 0.0025;
                    const animName = window.State.avatar3d.animation || "Đứng chờ tự nhiên";

                    root.position.y = Math.sin(t * 1.4) * 0.03;

                    if (avatarRef && avatarRef.userData) {
                        const { headGroup, leftArm, rightArm, leftLeg, rightLeg } = avatarRef.userData;
                        if (animName === "Xoay người 360°" || animName === "Trình diễn thời trang") {
                            root.rotation.y += 0.025;
                            leftArm.rotation.z = 0.55;
                            rightArm.rotation.z = -0.55;
                        } else if (animName === "Tạo dáng tự tin") {
                            rightArm.rotation.z = -1.05;
                            headGroup.rotation.z = 0.1;
                        } else if (animName === "Chỉnh tóc dịu dàng" || animName === "Ngắm gương") {
                            rightArm.rotation.x = -0.95;
                            rightArm.rotation.z = -0.35;
                            headGroup.rotation.y = 0.18;
                        } else if (animName === "Nhảy") {
                            avatarRef.position.y = Math.abs(Math.sin(t * 4.5)) * 0.28;
                            leftArm.rotation.z = 0.85;
                            rightArm.rotation.z = -0.85;
                        } else if (animName === "Đọc sách" || animName === "Uống trà") {
                            rightArm.rotation.x = -0.85;
                            leftArm.rotation.x = -0.55;
                            headGroup.rotation.x = 0.14;
                        } else if (animName === "Tương tác với pet") {
                            rightArm.rotation.z = -0.75 + Math.sin(t * 4) * 0.25;
                            headGroup.rotation.y = -0.25;
                        }
                    }

                    if (performance.now() < entry.actionUntil) {
                        root.position.y = Math.abs(Math.sin(t * 6)) * 0.22;
                    } else if (!dragging && mode === "pet") {
                        root.rotation.y += 0.005;
                    }
                    renderer.render(scene, camera);
                };
                this.scenes[canvasId] = entry;
                animate();
            },
            setCameraAngle(canvasId, rotY) {
                const s = this.scenes[canvasId];
                if (s) s.root.rotation.y = rotY;
            },
            zoomCamera(canvasId, delta) {
                const s = this.scenes[canvasId];
                if (!s) return;
                s.camera.position.z = Math.max(1.8, Math.min(6.8, s.camera.position.z + delta));
            },
            triggerAction(canvasId, type, duration = 2200) {
                const s = this.scenes[canvasId];
                if (!s) return;
                s.actionUntil = performance.now() + duration;
            },
            captureAvatarSnapshot(canvasId) {
                const s = this.scenes[canvasId];
                if (!s) return "";
                s.renderer.render(s.scene, s.camera);
                try { return s.renderer.domElement.toDataURL("image/png"); } catch { return ""; }
            }
        };

        // =========================================================================
        // 3. PERSONAL MUSIC PLAYER & CONTEXT-AWARE PET CHAT ENGINE
        // =========================================================================
        window.MusicPlayer = {
            tracks: [],
            idx: 0,
            loadFiles(e) {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;
                this.tracks = files.map(f => ({ name: f.name, url: URL.createObjectURL(f) }));
                this.idx = 0;
                this.playCurrent();
            },
            playCurrent() {
                const audio = document.getElementById("bg-audio-player");
                const title = document.getElementById("music-track-title");
                const btn = document.getElementById("music-play-btn");
                if (!audio || !this.tracks.length) return;
                audio.src = this.tracks[this.idx].url;
                audio.play().catch(() => {});
                if (title) title.textContent = "🎵 " + this.tracks[this.idx].name;
                if (btn) btn.textContent = "⏸ Dừng";
            },
            togglePlay() {
                const audio = document.getElementById("bg-audio-player");
                const btn = document.getElementById("music-play-btn");
                if (!audio || !this.tracks.length) {
                    window.App?.toast("Hãy nhấn '+ Nhạc' để chọn tệp âm thanh từ thiết bị của bạn.");
                    return;
                }
                if (audio.paused) { audio.play(); if (btn) btn.textContent = "⏸ Dừng"; }
                else { audio.pause(); if (btn) btn.textContent = "▶ Phát"; }
            },
            prev() { if (!this.tracks.length) return; this.idx = (this.idx - 1 + this.tracks.length) % this.tracks.length; this.playCurrent(); },
            next() { if (!this.tracks.length) return; this.idx = (this.idx + 1) % this.tracks.length; this.playCurrent(); },
            toggleLoop() {
                const audio = document.getElementById("bg-audio-player");
                const btn = document.getElementById("music-loop-btn");
                if (!audio) return;
                audio.loop = !audio.loop;
                if (btn) btn.className = audio.loop ? "p-1 rounded text-[11px] text-emerald-400" : "p-1 rounded text-[11px] text-slate-400";
            },
            setVolume(v) {
                const audio = document.getElementById("bg-audio-player");
                if (audio) audio.volume = parseFloat(v);
            }
        };

        window.PetChatEngine = {
            history: [
                { role: "pet", text: "안녕하세요 주인님! Hôm nay chúng ta cùng đọc truyện, luyện 4 kỹ năng tiếng Hàn và chăm sóc khu vườn nhé 💖" }
            ],
            openChat() {
                const pet = window.State.pet;
                window.App.showModal(`
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xl">${pet.species === "fox" ? "🦊" : (pet.species === "mouse" ? "🐭" : "🧜‍♀️")}</span>
                            <div>
                                <h3 class="font-bold text-sm text-emerald-400">Trò Chuyện Tiếng Hàn Cùng ${pet.name}</h3>
                                <div class="text-[10px] text-slate-400">Bạn đồng hành học tập • ${pet.mood}</div>
                            </div>
                        </div>
                        <button onclick="App.closeModal()" class="text-slate-400">✕</button>
                    </div>
                    <div id="pet-chat-log" class="space-y-2 max-h-64 overflow-y-auto p-3 rounded-2xl bg-slate-950 border border-slate-800 mb-3 text-xs">
                        ${this.history.map(m => `
                            <div class="${m.role === 'user' ? 'text-right' : 'text-left'}">
                                <span class="inline-block px-3 py-2 rounded-2xl ${m.role === 'user' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-200'}">${m.text}</span>
                            </div>
                        `).join("")}
                    </div>
                    <div class="flex gap-2">
                        <input id="pet-chat-input" type="text" placeholder="Nhắn tiếng Việt hoặc tiếng Hàn cho ${pet.name}..." onkeydown="if(event.key==='Enter') PetChatEngine.send()" class="flex-1 px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-xs">
                        <button onclick="PetChatEngine.send()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">Gửi</button>
                    </div>
                `);
            },
            async send() {
                const input = document.getElementById("pet-chat-input");
                const msg = input?.value?.trim();
                if (!msg) return;
                input.value = "";
                this.history.push({ role: "user", text: msg });
                this.openChat();

                let reply = "";
                if (!navigator.onLine || !window.State.apiKeys?.gemini) {
                    reply = `[Chế độ Offline / Chưa cấu hình Gemini API Key]: 주인님! Em đã ghi nhận lời nhắn "${msg}". Hãy cấu hình Gemini API Key trong Cài đặt (⚙️) để trò chuyện AI thông minh theo ngữ cảnh nhé!`;
                } else {
                    const contextSummary = this.history.slice(-6).map(h => `${h.role === 'user' ? 'Người học' : window.State.pet.name}: ${h.text}`).join("\n");
                    reply = await window.App.askGemini(`Bạn là thú cưng đồng hành tên ${window.State.pet.name} trong ứng dụng học tiếng Hàn Korean Reading Garden. Hãy phản hồi thân thiện, duy trì ngữ cảnh hội thoại, đặt câu hỏi tiếp nối bằng tiếng Hàn kèm dịch tiếng Việt và không gây áp lực cho người học:\n${contextSummary}`);
                }
                this.history.push({ role: "pet", text: reply });
                const speech = document.getElementById("sidebar-pet-speech");
                if (speech) speech.textContent = reply;
                this.openChat();
            }
        };

            toast(message, type = "info") {
                const container = document.getElementById("toast-container");

            async askGemini(prompt) {
                const key = window.State.apiKeys?.gemini;
                if (!key) {
                    return "⚠️ Chưa nhập Gemini API Key trong Cài đặt (⚙️). Hệ thống tuyệt đối không tạo kết quả giả khi chưa kết nối API.";
                }
                if (!navigator.onLine) {
                    return "⚠️ Thiết bị đang ngoại tuyến (Offline). Nội dung đã nhập của bạn được giữ nguyên — hãy kết nối mạng và nhấn thử lại.";
                }
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    return data?.candidates?.[0]?.content?.parts?.[0]?.text || "Không nhận được nội dung phản hồi từ Gemini API.";
                } catch (e) {
                    return `❌ Lỗi gọi Gemini API (${e.message}). Vui lòng kiểm tra lại API Key hoặc hạn mức và thử lại.`;
                }
            },

                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            },

            analyzeKoreanMorphology(surface) {
                const clean = surface.replace(/[.,!?'"“”‘’()\[\]{}…·~]/g, "").trim();
                let lemma = clean;
                let posGuess = "Danh từ";
                let grammarNote = "Dạng cơ bản trong câu";

                const particles = ["에서는", "에게서", "으로는", "은", "는", "이", "가", "을", "를", "에", "에서", "에게", "으로", "로", "와", "과", "도", "만", "의"];
                for (const p of particles) {
                    if (clean.endsWith(p) && clean.length > p.length) {
                        lemma = clean.slice(0, -p.length);
                        posGuess = "Danh từ";
                        grammarNote = `Nguyên thể "${lemma}" + trợ từ "${p}"`;
                        return { surface: clean, lemma, pos: posGuess, grammar: grammarNote };
                    }
                }
                const endings = ["았습니다", "었습니다", "했습니다", "습니다", "았어요", "었어요", "했어요", "어요", "아요", "해요", "았다", "었다", "했다", "고", "는", "은"];
                for (const end of endings) {
                    if (clean.endsWith(end) && clean.length > end.length) {
                        const stem = clean.slice(0, -end.length);
                        lemma = (end.startsWith("했") || end.startsWith("해")) ? stem + "하다" : stem + "다";
                        posGuess = "Động từ";
                        grammarNote = `Gốc "${stem}" + đuôi từ "-${end}"`;
                        return { surface: clean, lemma, pos: posGuess, grammar: grammarNote };
                    }
                }
                return { surface: clean, lemma, pos: posGuess, grammar: grammarNote };
            },

            viewLibrary(el) {

                let filtered = allStories.filter(st => {

                    const matchQ = !q || [st.title, st.subtitle, st.author, ...genres].some(x => (x || "").toLowerCase().includes(q));
                    const matchShelf = (lp.activeShelf || "Tất cả") === "Tất cả" || st.shelf === lp.activeShelf;
                    const matchGenre = (lp.activeGenre || "Tất cả") === "Tất cả" || genres.includes(lp.activeGenre);
                    const matchStatus = (lp.activeStatus || "Tất cả") === "Tất cả" || (lp.activeStatus === "favorite" ? st.favorite : (st.status || "want") === lp.activeStatus);
                    return matchQ && matchShelf && matchGenre && matchStatus;

                            </div>
                            <div class="flex flex-wrap gap-2">

                                    <option value="favorite" ${lp.activeStatus==='favorite'?'selected':''}>❤️ Yêu thích</option>
                                    <option value="reading" ${lp.activeStatus==='reading'?'selected':''}>📖 Đang đọc</option>
                                    <option value="completed" ${lp.activeStatus==='completed'?'selected':''}>✅ Đã đọc</option>
                                    <option value="want" ${lp.activeStatus==='want'?'selected':''}>🔖 Muốn đọc</option>
                                    <option value="paused" ${lp.activeStatus==='paused'?'selected':''}>⏸ Đọc dở</option>
                                </select>
                                <select onchange="window.State.libraryPrefs.sortBy=this.value; App.renderTab('library')" class="px-2.5 py-2 rounded-xl bg-slate-800 border border-slate-700">
                                    <option value="recent" ${lp.sortBy==='recent'?'selected':''}>Sắp xếp: Ngày thêm</option>
                                    <option value="title" ${lp.sortBy==='title'?'selected':''}>Sắp xếp: Tên truyện</option>
                                    <option value="author" ${lp.sortBy==='author'?'selected':''}>Sắp xếp: Tác giả</option>
                                    <option value="progress" ${lp.sortBy==='progress'?'selected':''}>Sắp xếp: Tiến độ đọc</option>
                                </select>
                            </div>

                            <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-800">

                            </div>
                        </div>

                        <div class="p-4 rounded-3xl border border-slate-800" style="background:${lp.bgColor || '#020617'};">
                            <div class="${lp.viewMode === 'grid' ? 'grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4' : 'space-y-3'}" style="gap:${lp.gridGap || 16}px;">

            findStoryById(storyId) {
                return KRG_DATA.sampleStories.find(s => s.id === storyId) || (window.State.stories || []).find(s => s.id === storyId);

            toggleStoryFavorite(storyId) {
                const st = this.findStoryById(storyId);
                if (st) { st.favorite = !st.favorite; window.saveState(); this.renderTab("library"); }
            },

            updateStoryStatus(storyId, status) {
                const st = this.findStoryById(storyId);
                if (st) { st.status = status; window.saveState(); this.toast("Đã cập nhật trạng thái đọc!", "success"); }
            },

                    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">

                        <button onclick="App.closeModal()" class="text-slate-400">✕</button>

                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="text-slate-400 block mb-1">Tên kệ sách / bộ sưu tập cá nhân mới:</label>
                            <div class="flex gap-2">

                            </div>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">Tên thể loại truyện tự tạo mới:</label>
                            <div class="flex gap-2">
                                <input id="new-genre-input" placeholder="VD: Cổ đại cung đình" class="flex-1 px-3 py-2 rounded-xl bg-slate-800 border border-slate-700">
                                <button onclick="const v=document.getElementById('new-genre-input').value.trim(); if(v){window.State.customGenres.push(v); window.saveState(); App.closeModal(); App.renderTab('library'); App.toast('Đã thêm thể loại mới!','success');}" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold">+ Thêm Thể Loại</button>

                        </div>
                    </div>
                `);
            },

                const story = this.findStoryById(storyId);
                if (!story) return;
                const cov = window.State.customCovers[storyId] || {
                    presetId: "preset_emerald", imageData: "", zoom: 1, offsetX: 0, offsetY: 0, aspectMode: "cover",
                    customTitle: story.title, customSubtitle: story.subtitle || "", customAuthor: story.author || "",

                    overlayColor: "#000000", overlayOpacity: 0.32, decorBorder: true

                window.State.customCovers[storyId] = cov;

                const studioPhotos = window.State.room.photos || [];
                this.showModal(`
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">

                                </div>
                            ` : ''}

                        <div class="md:col-span-7 space-y-3">

                                <label class="text-[11px] font-bold text-emerald-400 block mb-1">Mẫu bìa có sẵn trong hệ thống:</label>

                                    ${KRG_DATA.bookCoverPresets.map(p => `
                                        <button onclick="window.State.customCovers['${storyId}'].imageData=''; window.State.customCovers['${storyId}'].presetId='${p.id}'; App.refreshCoverPreview('${storyId}')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px]">${p.icon} ${p.name}</button>
                                    `).join("")}
                                </div>
                            </div>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                                <div><label class="text-[10px] text-slate-400">Phóng to/Thu nhỏ</label><input type="range" min="0.8" max="2.2" step="0.05" value="${cov.zoom || 1}" oninput="window.State.customCovers['${storyId}'].zoom=parseFloat(this.value); App.refreshCoverPreview('${storyId}')" class="w-full accent-purple-500"></div>

                            </div>

                            <div class="flex flex-wrap gap-2 pt-2">
                                <button onclick="window.saveState(); App.closeModal(); App.renderTab('library'); App.toast('Đã lưu bìa tùy chỉnh (không làm thay đổi nội dung truyện)!', 'success')" class="flex-1 py-2 rounded-xl bg-emerald-600 text-white font-bold">💾 Lưu Bìa Tùy Chỉnh</button>

            refreshCoverPreview(storyId) {

            async handleImportStoryFile(e) {
                const file = e.target.files?.[0];
                if (!file) return;
                const ext = (file.name.split(".").pop() || "").toLowerCase();
                this.toast(`⏳ Đang trích xuất nội dung từ ${file.name}...`);
                try {
                    let rawText = "";
                    if (ext === "txt") {
                        rawText = await file.text();
                    } else if (ext === "docx" && window.mammoth) {
                        const buf = await file.arrayBuffer();
                        const res = await mammoth.extractRawText({ arrayBuffer: buf });
                        rawText = res.value || "";
                    } else if (ext === "epub" && window.JSZip) {
                        const buf = await file.arrayBuffer();
                        const zip = await JSZip.loadAsync(buf);
                        const htmlFiles = Object.keys(zip.files).filter(f => /\.(xhtml|html|htm)$/i.test(f)).sort();
                        for (const hf of htmlFiles) {
                            const content = await zip.files[hf].async("string");
                            const doc = new DOMParser().parseFromString(content, "text/html");
                            rawText += "\n" + (doc.body?.textContent || "");
                        }
                    } else if (ext === "pdf" && window.pdfjsLib) {
                        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
                        const buf = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
                        for (let p = 1; p <= pdf.numPages; p++) {
                            const page = await pdf.getPage(p);
                            const tc = await page.getTextContent();
                            rawText += "\n" + tc.items.map(it => it.str).join(" ");
                        }
                    }
                    const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                    if (!lines.length) { this.toast("Không tìm thấy văn bản đọc được trong tệp."); return; }
                    const paragraphs = lines.slice(0, 300).map(kr => ({
                        kr,
                        vi: "Nhấn nút dịch hoặc 'Dịch đối chứng' ở đoạn này."
                    }));
                    const id = "st_" + Date.now();
                    window.State.stories.unshift({
                        id,
                        title: file.name.replace(/\.[^.]+$/, ""),
                        subtitle: `Tệp ${ext.toUpperCase()} (${paragraphs.length} đoạn)`,
                        author: "Tài liệu nhập",
                        genres: ["Văn học"],
                        status: "reading",
                        addedAt: new Date().toISOString().slice(0, 10),
                        shelf: window.State.customShelves?.[0] || "Văn học chữa lành",
                        paragraphs
                    });
                    window.State.activeStoryId = id;
                    window.saveState();
                    this.renderTab("reader");
                    this.toast(`Đã nhập thành công ${paragraphs.length} đoạn văn!`, "success");
                } catch (err) {
                    this.toast("Lỗi đọc tệp truyện: " + err.message);
                }
            },

            async fetchNiklDictionary(lemma) {
                const box = document.getElementById("dict-layer-nikl");
                if (!box) return;
                if (window.State.dictCache?.[lemma]?.dict) {
                    box.textContent = window.State.dictCache[lemma].dict;
                    return;
                }
                const niklKey = window.State.apiKeys?.nikl;
                if (!niklKey) {
                    box.textContent = "Chưa nhập Korean Basic Dictionary Open API Key trong Cài đặt (⚙️). Vui lòng cấu hình khóa từ krdict.korean.go.kr để lấy dữ liệu từ điển chuẩn.";
                    return;
                }
                if (!navigator.onLine) {
                    box.textContent = "Đang ngoại tuyến (Offline) — chỉ hiển thị các từ đã lưu trong bộ nhớ đệm.";
                    return;
                }
                try {
                    const res = await fetch(`https://krdict.korean.go.kr/api/search?key=${encodeURIComponent(niklKey)}&q=${encodeURIComponent(lemma)}&translated=y&trans_lang=7`);
                    const xmlText = await res.text();
                    const doc = new DOMParser().parseFromString(xmlText, "text/xml");
                    const items = Array.from(doc.querySelectorAll("item")).slice(0, 3);
                    if (!items.length) {
                        box.textContent = `Không tìm thấy mục từ "${lemma}" trên Korean Basic Dictionary.`;
                        return;
                    }
                    const summary = items.map((it, i) => {
                        const pos = it.querySelector("pos")?.textContent || "";
                        const trans = it.querySelector("trans_word")?.textContent || "";
                        const def = it.querySelector("trans_dfn")?.textContent || it.querySelector("definition")?.textContent || "";
                        return `${i + 1}. [${pos}] ${trans}: ${def}`;
                    }).join("\n");
                    window.State.dictCache[lemma] = { ...(window.State.dictCache[lemma] || {}), dict: summary };
                    window.saveState();
                    box.textContent = summary;
                } catch (e) {
                    box.textContent = `Lỗi kết nối Korean Basic Dictionary API (${e.message}).`;
                }
            },

            async explainWordWithGeminiContext(surface, lemma, storyId, paraIdx) {
                const box = document.getElementById("dict-layer-ai");
                if (!box) return;
                const story = this.findStoryById(storyId);
                const sentence = story?.paragraphs?.[paraIdx]?.kr || "";
                const dictInfo = window.State.dictCache?.[lemma]?.dict || "";
                box.textContent = "⏳ Gemini AI đang giải thích nghĩa theo ngữ cảnh câu truyện...";
                const res = await this.askGemini(`Giải thích từ tiếng Hàn "${surface}" (nguyên thể: "${lemma}") trong ngữ cảnh câu: "${sentence}".
Dữ liệu từ điển gốc: ${dictInfo}
Hãy giải thích: nghĩa phù hợp nhất trong câu này, phân biệt các nghĩa gần nhau, đề xuất loại từ trong 16 từ loại tiếng Hàn và 1 ví dụ ngắn.`);
                window.State.dictCache[lemma] = { ...(window.State.dictCache[lemma] || {}), ai: res };
                window.saveState();
                box.textContent = res;
            },

            restoreOriginalDictMeaning(lemma) {
                const orig = window.State.dictCache?.[lemma]?.dict || "";
                const inp = document.getElementById("dict-user-custom-meaning");
                if (inp && orig) {
                    inp.value = orig.split("\n")[0];
                    this.toast("Đã khôi phục nghĩa gốc từ điển vào ô chỉnh sửa!");
                }

            saveThreeLayerWord(surface, lemma, storyId, paraIdx) {
                const story = this.findStoryById(storyId);
                const sentence = story?.paragraphs?.[paraIdx]?.kr || "";
                const customMeaning = document.getElementById("dict-user-custom-meaning")?.value?.trim();
                const pos = document.getElementById("dict-user-pos")?.value || "Danh từ";
                const dictMeaning = window.State.dictCache?.[lemma]?.dict || "Chưa có dữ liệu từ điển NIKL";
                const aiMeaning = window.State.dictCache?.[lemma]?.ai || "";
                const finalMeaning = customMeaning || dictMeaning.split("\n")[0];

                const existing = window.State.vocab.find(v => v.word === surface && v.pos === pos);
                if (existing) {
                    existing.meaning = finalMeaning;
                    existing.dictMeaning = dictMeaning;
                    existing.aiMeaning = aiMeaning;
                } else {
                    window.State.vocab.unshift({
                        id: "v_" + Date.now(),
                        word: surface,
                        lemma,
                        dictMeaning,
                        aiMeaning,
                        meaning: finalMeaning,
                        pos,
                        pron: surface,
                        level: "TOPIK I",
                        category: "Từ mới",
                        example: sentence,
                        sourceStory: story?.title || "",
                        addedAt: new Date().toISOString().slice(0, 10),
                        status: "new"
                    });
                }
                window.saveState();
                this.closeInlinePopover();
                this.toast(`Đã lưu "${surface}" (${pos}) với 3 lớp nghĩa vào Sổ tay từ vựng!`, "success");
            },

            async handleVocabFileUpload(e) {
                const file = e.target.files?.[0];
                const preview = document.getElementById("imp-vocab-preview");
                const btn = document.getElementById("imp-vocab-confirm-btn");
                if (!file || !preview) return;
                const ext = (file.name.split(".").pop() || "").toLowerCase();
                preview.textContent = `⏳ Đang phân tích tệp "${file.name}"...`;

                try {
                    let rows = [];
                    if ((ext === "xlsx" || ext === "xls" || ext === "csv") && window.XLSX) {
                        const buf = await file.arrayBuffer();
                        const wb = XLSX.read(buf, { type: "array" });
                        const sheet = wb.Sheets[wb.SheetNames[0]];
                        const jsonRows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        rows = jsonRows.filter(r => r && r.length >= 1 && String(r[0]).trim()).map(r => ({
                            word: String(r[0] || "").trim(),
                            meaning: String(r[1] || "").trim(),
                            pos: String(r[2] || "").trim(),
                            example: String(r[3] || "").trim()
                        }));
                        if (rows.length && /từ|word|korean|한글/i.test(rows[0].word) && /nghĩa|meaning/i.test(rows[0].meaning)) {
                            rows.shift();
                        }
                    } else {
                        let raw = "";
                        if (ext === "docx" && window.mammoth) {
                            const buf = await file.arrayBuffer();
                            const res = await mammoth.extractRawText({ arrayBuffer: buf });
                            raw = res.value || "";
                        } else {
                            raw = await file.text();
                        }
                        rows = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
                            const parts = line.split(/\t|\s+[-–:]\s+|\|/);
                            return {
                                word: (parts[0] || "").trim(),
                                meaning: (parts[1] || "Chưa có nghĩa").trim(),
                                pos: (parts[2] || "").trim(),
                                example: (parts[3] || "").trim()
                            };
                        });
                    }

                    const parsed = rows.filter(r => r.word).map(r => {
                        const morph = this.analyzeKoreanMorphology(r.word);
                        const validPos = KRG_DATA.posList16.includes(r.pos) ? r.pos : morph.pos;
                        return {
                            word: r.word,
                            lemma: morph.lemma,
                            meaning: r.meaning || "Chưa cập nhật nghĩa",
                            pos: validPos,
                            example: r.example || "",
                            sourceFile: file.name
                        };
                    });

                    this.pendingImportedVocab = parsed;
                    if (!parsed.length) {
                        preview.textContent = "Không tìm thấy dòng từ vựng hợp lệ trong tệp.";
                        if (btn) btn.disabled = true;
                        return;
                    }
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = `💾 Xác Nhận Nhập ${parsed.length} Từ Vựng Vào Sổ Tay`;
                    }
                    preview.innerHTML = `
                        <div class="font-bold text-emerald-400 mb-2">✅ Đã đọc được ${parsed.length} từ vựng từ "${file.name}":</div>
                        <div class="space-y-1.5">
                            ${parsed.slice(0, 50).map((it, i) => `
                                <div class="p-2 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-between gap-2">
                                    <div>
                                        <span class="font-bold font-korean text-white">${i + 1}. ${it.word}</span>
                                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 ml-1">${it.pos}</span>
                                        <span class="text-slate-300 ml-1.5">— ${it.meaning}</span>
                                    </div>
                                    <span class="text-[10px] text-slate-500">Gốc: ${it.lemma}</span>
                                </div>
                            `).join("")}
                            ${parsed.length > 50 ? `<div class="text-center text-slate-400 pt-1">... và ${parsed.length - 50} từ khác</div>` : ''}
                        </div>
                    `;
                } catch (err) {
                    preview.textContent = "❌ Lỗi đọc tệp từ vựng: " + err.message;
                }
            },

            async generateListeningExercise() {
                const mode = document.getElementById("ls-mode")?.value || KRG_DATA.listeningModes[0].name;
                const ctx = document.getElementById("ls-context")?.value || KRG_DATA.listeningContexts[0];
                const vocabSample = window.State.vocab.slice(0, 5).map(v => v.word).join(", ");
                const box = document.getElementById("ls-exercise-box");
                if (!box) return;
                box.textContent = "⏳ Gemini AI đang tạo bài luyện nghe mới...";
                const res = await this.askGemini(`Tạo 1 bài luyện nghe tiếng Hàn trình độ ${this.skillLevel}, bối cảnh: "${ctx}", dạng bài: "${mode}".
Có thể lồng ghép tự nhiên một số từ vựng người học đã lưu: [${vocabSample}].
Trả về đúng định dạng:
[SCRIPT_KR]
(Đoạn hội thoại hoặc thông báo tiếng Hàn 3-5 câu)
[QUESTION]
(Câu hỏi và các lựa chọn A/B/C/D hoặc chỗ trống cần điền, chưa tiết lộ đáp án ngay)`);
                if (res.startsWith("⚠️") || res.startsWith("❌")) {
                    box.textContent = res;
                    return;
                }
                const scriptMatch = res.match(/\[SCRIPT_KR\]([\s\S]*?)\[QUESTION\]/);
                const qMatch = res.match(/\[QUESTION\]([\s\S]*)/);
                if (scriptMatch) {
                    this.listeningAudioText = scriptMatch[1].trim();
                    this.renderTab("skills");
                    setTimeout(() => {
                        const b = document.getElementById("ls-exercise-box");
                        if (b) b.textContent = qMatch ? qMatch[1].trim() : res;
                        this.speakKorean(this.listeningAudioText, this.listeningRate);
                    }, 60);
                } else {
                    box.textContent = res;
                }
            },

            async gradeListeningAnswer() {
                const ans = document.getElementById("ls-user-answer")?.value?.trim();
                const qText = document.getElementById("ls-exercise-box")?.textContent || "";
                const out = document.getElementById("ls-grade-out");
                if (!ans || !out) return;
                out.textContent = "⏳ Đang chấm đáp án bài nghe...";
                out.textContent = await this.askGemini(`Chấm đáp án bài nghe tiếng Hàn sau và giải thích chi tiết:\nBản ghi âm thanh: "${this.listeningAudioText}"\nCâu hỏi: "${qText}"\nCâu trả lời của học viên: "${ans}"`);
            },

            startKoreanSpeechRecognition() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                const status = document.getElementById("sp-mic-status");
                const area = document.getElementById("sp-user-speech");
                if (!SR) {
                    this.toast("Trình duyệt hiện tại không hỗ trợ Web Speech API. Bạn có thể gõ trực tiếp câu trả lời tiếng Hàn vào ô bên dưới.");
                    return;
                }
                try {
                    const rec = new SR();
                    rec.lang = "ko-KR";
                    rec.interimResults = false;
                    rec.onstart = () => { if (status) status.textContent = "🔴 Đang nghe giọng nói tiếng Hàn của bạn..."; };
                    rec.onresult = (e) => {
                        const transcript = e.results?.[0]?.[0]?.transcript || "";
                        if (area) area.value = (area.value ? area.value + " " : "") + transcript;
                        if (status) status.textContent = "✅ Đã chuyển giọng nói thành văn bản tiếng Hàn!";
                    };
                    rec.onerror = (e) => { if (status) status.textContent = "⚠️ Lỗi micro: " + e.error; };
                    rec.start();
                } catch (err) {
                    this.toast("Không thể mở micro: " + err.message);
                }
            },

            async generateSpeakingPrompt(kind) {
                const topic = document.getElementById("sp-topic")?.value;
                const task = document.getElementById("sp-sentence-task")?.value;

                const vocabWords = window.State.vocab.slice(0, 4).map(v => v.word).join(", ");

                box.textContent = "⏳ Gemini AI đang tạo đề bài luyện nói...";
                const prompt = kind === "topic"
                    ? `Tạo bộ 3 câu hỏi luyện nói tiếng Hàn (từ dễ đến nâng cao: giải thích, miêu tả, so sánh, nêu quan điểm) cho chủ đề "${topic}", trình độ ${this.skillLevel}. ${blind ? "Không hiển thị câu trả lời mẫu." : "Kèm gợi ý từ vựng/cấu trúc."}`
                    : `Tạo bài tập luyện xây dựng câu tiếng Hàn theo dạng: "${task}", trình độ ${this.skillLevel}. Hãy sử dụng các từ vựng liên quan từ kho của học viên: [${vocabWords}]. Nêu rõ yêu cầu đề bài và từ khóa/ngữ pháp cần dùng.`;

            async startSpeakingRoleplay() {
                const scenario = document.getElementById("sp-roleplay")?.value;

                this.speakingRoleplayHistory = [];
                box.textContent = "⏳ AI đang mở đầu cuộc hội thoại nhập vai thực tế...";
                const reply = await this.askGemini(`Hãy đóng vai trong tình huống giao tiếp thực tế: "${scenario}" (trình độ ${this.skillLevel}). Hãy mở đầu cuộc hội thoại tự nhiên bằng tiếng Hàn (kèm dịch tiếng Việt ngắn gọn) và đặt câu hỏi để người học phản hồi.`);
                this.speakingRoleplayHistory.push({ role: "ai", text: reply });
                box.textContent = reply;
            },

            async continueRoleplayTurn() {
                const userText = document.getElementById("sp-user-speech")?.value?.trim();
                const box = document.getElementById("sp-prompt-box");
                if (!userText || !box) { this.toast("Hãy nhập hoặc ghi âm câu trả lời của bạn trước."); return; }
                this.speakingRoleplayHistory.push({ role: "user", text: userText });
                const hist = this.speakingRoleplayHistory.map(m => `${m.role === 'ai' ? 'AI' : 'Học viên'}: ${m.text}`).join("\n");
                box.textContent = "⏳ AI đang phản hồi theo ngữ cảnh và đặt câu hỏi tiếp nối...";
                const reply = await this.askGemini(`Tiếp tục cuộc hội thoại nhập vai tiếng Hàn theo ngữ cảnh sau. Hãy phản hồi tự nhiên bằng tiếng Hàn (kèm dịch Việt), chỉnh nhẹ nếu học viên có lỗi nhỏ, và LUÔN đặt câu hỏi tiếp nối để duy trì hội thoại nhiều lượt:\n${hist}`);
                this.speakingRoleplayHistory.push({ role: "ai", text: reply });
                box.textContent = reply;
            },

            generatePersonalVocabQuiz() {
                const count = parseInt(document.getElementById("ex-count")?.value || "5");
                const mode = document.getElementById("ex-mode")?.value || "practice";
                const type = document.getElementById("ex-type")?.value || "Kiểm tra từ vựng";
                const pool = [...(window.State.vocab || [])];
                while (pool.length < 4) {
                    pool.push(
                        { word: "책방", meaning: "Hiệu sách nhỏ", pos: "Danh từ", example: "작은 책방을 발견했다." },
                        { word: "달빛", meaning: "Ánh trăng", pos: "Danh từ", example: "달빛이 파도 위에 부서진다." },
                        { word: "하얀 여우", meaning: "Chú cáo trắng", pos: "Danh từ", example: "하얀 여우가 책을 읽고 있다." },
                        { word: "따뜻하다", meaning: "Ấm áp", pos: "Tính từ", example: "차 향기가 따뜻하다." }
                    );
                }
                const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, Math.min(count, pool.length));
                const questions = shuffled.map((item, idx) => {
                    const distractors = pool.filter(x => x.word !== item.word).sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.meaning);
                    const options = [item.meaning, ...distractors].sort(() => Math.random() - 0.5);
                    return {
                        q: `Câu ${idx + 1}: Nghĩa của từ "${item.word}" (${item.pos || "Từ vựng"}) là gì?`,
                        audio: item.word,
                        options,
                        answer: item.meaning,
                        explain: `"${item.word}" (Gốc: ${item.lemma || item.word}) có nghĩa là "${item.meaning}". Ví dụ: ${item.example || ""}`
                    };
                });

                this.activeExamData = {
                    title: `${type} (Kho Kiến Thức Cá Nhân)`,
                    questions,
                    startedAt: Date.now(),
                    timed: mode === "timed",
                    submitted: false,
                    userAnswers: {}
                };
                this.renderTab("examcenter");
            },

[{"q":"Câu hỏi...","audio":"Câu tiếng Hàn đọc nếu có","options":["A","B","C","D"],"answer":"Đáp án đúng chính xác như trong options","explain":"Giải thích chi tiết"}]`);

                    "6. Royal Style": { accent: "#1d4ed8", trim: "#fbbf24" },
                    "7. Witch Style": { accent: "#581c87", trim: "#c084fc" },
                    "8. Wizard Style": { accent: "#1e3a8a", trim: "#38bdf8" },
                    "9. Botanical Garden": { accent: "#15803d", trim: "#86efac" },
                    "10. Cottagecore": { accent: "#65a30d", trim: "#fef08a" },
                    "11. Fairy Style": { accent: "#34d399", trim: "#f5d0fe" },
                    "12. Angel Style": { accent: "#e0f2fe", trim: "#fde68a" },
                    "13. Christmas Style": { accent: "#dc2626", trim: "#facc15" },
                    "14. Halloween Style": { accent: "#ea580c", trim: "#9333ea" },
                    "15. Spring Style": { accent: "#f9a8d4", trim: "#fef9c3" },
                    "16. Summer Style": { accent: "#0284c7", trim: "#fde047" },
                    "17. Traditional Style": { accent: "#b91c1c", trim: "#fbbf24" },
                    "18. Japanese Kimono": { accent: "#be185d", trim: "#fbcfe8" },
                    "19. Korean Hanbok": { accent: "#e11d48", trim: "#38bdf8" },
                    "20. Fantasy Adventure": { accent: "#0d9488", trim: "#fbbf24" }
                };
                const pal = styleColorMap[styleName] || { accent: "#34d399", trim: "#fbbf24" };
                p.accentColor = pal.accent;
                p.trimColor = pal.trim;
                specCfg.categories.forEach(cat => {
                    const validOpts = cat.options.filter(o => o !== "Không");
                    if (validOpts.length) {
                        p.outfit[cat.id] = validOpts[Math.floor(Math.random() * validOpts.length)];
                    }
                });
                window.saveState();
                this.refreshPetCanvases();
                this.renderTab("studio");
                this.toast(`Đã phối trang phục ${styleName} cho ${p.name}!`, "success");
            },

            randomizePetOutfit() {
                const randomStyle = KRG_DATA.petStyles[Math.floor(Math.random() * KRG_DATA.petStyles.length)];
                this.applyPetStylePreset(randomStyle);
            },

            resetPetOutfit() {
                const p = window.State.pet;
                const specCfg = KRG_DATA.petSpeciesWardrobe[p.species] || KRG_DATA.petSpeciesWardrobe.fox;
                specCfg.categories.forEach(cat => { p.outfit[cat.id] = "Không"; });
                window.saveState();
                this.refreshPetCanvases();
                this.renderTab("studio");
                this.toast(`Đã tháo toàn bộ trang phục cho ${p.name}!`);
            },

            saveCurrentPetOutfit() {
                const p = window.State.pet;
                const name = prompt(`Đặt tên bộ phối đồ cho ${p.name}:`, `${p.name} • ${p.style}`);
                if (!name) return;
                if (!p.savedPetOutfits) p.savedPetOutfits = [];
                p.savedPetOutfits.unshift({
                    id: "po_" + Date.now(),
                    species: p.species,
                    name,
                    style: p.style,
                    primaryColor: p.primaryColor,
                    accentColor: p.accentColor,
                    trimColor: p.trimColor || "#fbbf24",
                    outfit: structuredClone(p.outfit)
                });
                window.saveState();
                this.renderTab("studio");
                this.toast(`Đã lưu bộ phối đồ "${name}"!`, "success");
            },

            applySavedPetOutfit(id) {
                const p = window.State.pet;
                const found = (p.savedPetOutfits || []).find(o => o.id === id);
                if (!found) return;
                p.style = found.style;
                p.primaryColor = found.primaryColor;
                p.accentColor = found.accentColor;
                p.trimColor = found.trimColor || "#fbbf24";
                p.outfit = structuredClone(found.outfit);
                window.saveState();
                this.refreshPetCanvases();
                this.renderTab("studio");
                this.toast(`Đã mặc bộ "${found.name}" cho ${p.name}!`, "success");
            },

            deleteSavedPetOutfit(id) {
                window.State.pet.savedPetOutfits = (window.State.pet.savedPetOutfits || []).filter(o => o.id !== id);
                window.saveState();
                this.renderTab("studio");
            },

            switchPetSpecies(species) {
                window.State.pet.species = species;
                const specCfg = KRG_DATA.petSpeciesWardrobe[species];
                window.State.pet.outfit = {};
                specCfg.categories.forEach(cat => {
                    window.State.pet.outfit[cat.id] = cat.options[1] || "Không";
                });
                if (species === "fox") { window.State.pet.name = "Bạch Hồ"; window.State.pet.primaryColor = "#f8fafc"; }
                else if (species === "mouse") { window.State.pet.name = "Tí Nâu"; window.State.pet.primaryColor = "#e2e8f0"; }
                else { window.State.pet.name = "Thủy Tinh"; window.State.pet.primaryColor = "#fde6d8"; }
                window.saveState();
                this.updateHeaderWidgets();
                ThreeEngine.mountScene("sidebar-pet-3d-canvas", "pet");
                this.renderTab("studio");
            },

            // ---------------- VIEW: PET CARE & 20 GAMES ----------------
            viewPetCare(el) {
                const p = window.State.pet;
                const progress = window.State.room.playProgress || { totalPlayed: 0, points: 0, completedGames: [] };
                el.innerHTML = `
                    <div class="space-y-5 text-xs">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <h2 class="text-xl font-bold text-amber-400">🍓 Pet Care & Khu Vui Chơi 20 Trò Chơi Tương Tác</h2>
                                <p class="text-slate-400">Chăm sóc bạn đồng hành ${p.name} — không gây áp lực nếu bận rộn, luôn cổ vũ tích cực mỗi khi bạn học!</p>
                            </div>
                            <span class="px-3 py-1.5 rounded-xl bg-emerald-500/15 text-emerald-300 font-bold">Đã chơi: ${progress.totalPlayed} lượt • Điểm gắn kết: ${progress.points} ⭐</span>
                        </div>

                        <div class="grid lg:grid-cols-12 gap-5">
                            <div class="lg:col-span-4 p-4 rounded-3xl bg-slate-900 border border-slate-800 space-y-3">
                                <div class="w-full h-64 rounded-2xl bg-slate-950 border border-slate-800 overflow-hidden">
                                    <canvas id="petcare-3d-canvas" class="w-full h-full block"></canvas>
                                </div>
                                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800">
                                    <div class="font-bold text-emerald-400">${p.name} • ${p.mood}</div>
                                    <div id="petcare-react-text" class="text-slate-300 mt-1">Chọn món ăn hoặc trò chơi bên cạnh để tương tác cùng ${p.name}!</div>
                                </div>
                            </div>

                            <div class="lg:col-span-8 space-y-4">
                                <div class="p-4 rounded-3xl bg-slate-900 border border-slate-800 space-y-2.5">
                                    <h3 class="font-bold text-sm text-pink-400">🍽️ Cho Pet Ăn (6 Nhóm Thực Phẩm)</h3>
                                    <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-2">
                                        ${KRG_DATA.foods.map(f => `
                                            <button onclick="App.feedPet('${f.id}')" class="p-2.5 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-left flex items-center gap-2">
                                                <span class="text-xl">${f.icon}</span>
                                                <div>
                                                    <div class="font-bold text-white">${f.name}</div>
                                                    <div class="text-[10px] text-slate-400">${f.group}</div>
                                                </div>
                                            </button>
                                        `).join("")}
                                    </div>
                                </div>

                                <div class="p-4 rounded-3xl bg-slate-900 border border-slate-800 space-y-2.5">
                                    <h3 class="font-bold text-sm text-sky-400">🎮 Khu Vui Chơi Playroom (20 Trò Chơi Tương Tác)</h3>
                                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 max-h-64 overflow-y-auto pr-1">
                                        ${KRG_DATA.playroomGames.map(g => {
                                            const done = (progress.completedGames || []).includes(g.id);
                                            return `
                                                <button onclick="App.playMiniGame(${g.id})" class="p-2.5 rounded-xl bg-slate-950 hover:bg-indigo-500/15 border ${done ? 'border-emerald-500/40' : 'border-slate-800'} text-left">
                                                    <div class="text-base">${g.icon}</div>
                                                    <div class="font-bold text-white mt-0.5">${g.name}</div>
                                                    <div class="text-[10px] text-slate-400 line-clamp-1">${g.desc}</div>
                                                </button>
                                            `;
                                        }).join("")}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                setTimeout(() => ThreeEngine.mountScene("petcare-3d-canvas", "pet"), 60);
            },

            feedPet(foodId) {
                const f = KRG_DATA.foods.find(x => x.id === foodId);
                if (!f) return;
                window.State.pet.mood = "Hạnh phúc 🥰";
                window.saveState();
                ThreeEngine.triggerAction("petcare-3d-canvas", "eat", 2200);
                const box = document.getElementById("petcare-react-text");
                if (box) box.textContent = `${f.icon} ${window.State.pet.name} thưởng thức ${f.name}: "${f.react}"`;
                this.toast(`${window.State.pet.name} rất thích ${f.name}!`, "success");
            },

            playMiniGame(gameId) {
                const g = KRG_DATA.playroomGames.find(x => x.id === gameId);
                if (!g) return;
                const p = window.State.room.playProgress;
                p.totalPlayed = (p.totalPlayed || 0) + 1;
                p.points = (p.points || 0) + 15;
                if (!p.completedGames.includes(gameId)) p.completedGames.push(gameId);
                window.saveState();
                ThreeEngine.triggerAction("petcare-3d-canvas", "play", 2400);
                const box = document.getElementById("petcare-react-text");
                if (box) box.textContent = `${g.icon} Đã chơi "${g.name}" cùng ${window.State.pet.name}! (+15 điểm gắn kết)`;
                this.toast(`Hoàn thành trò chơi "${g.name}" (+15⭐)!`, "success");
            },

            // ---------------- VIEW: 8-ZONE 3D PERSONAL WORLD & PHOTO STUDIO ----------------
            viewMyRoom(el) {
                const room = window.State.room;
                const currentZone = KRG_DATA.worldZones.find(z => z.id === room.zoneId) || KRG_DATA.worldZones[0];
                const photos = room.photos || [];

                el.innerHTML = `
                    <div class="space-y-5 text-xs">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <h2 class="text-xl font-bold text-indigo-400">🏡 Không Gian 3D Cá Nhân (8 Khu Vực) & Photo Studio</h2>
                                <p class="text-slate-400">Nhân vật 3D và thú cưng xuất hiện cùng nhau trong 8 khu vực sinh hoạt và chụp ảnh kỷ niệm.</p>
                            </div>
                            <button onclick="App.captureStudioPhoto()" class="px-4 py-2 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-bold">📸 Chụp Ảnh Photo Studio</button>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            ${KRG_DATA.worldZones.map(z => `
                                <button onclick="App.switchWorldZone('${z.id}')" class="p-2.5 rounded-xl border text-left ${room.zoneId===z.id?'border-emerald-500 bg-emerald-500/15 text-emerald-200 font-bold':'border-slate-800 bg-slate-900 text-slate-300'}">
                                    ${z.name}
                                </button>
                            `).join("")}
                        </div>

                        <div class="grid lg:grid-cols-12 gap-5">
                            <div class="lg:col-span-8 p-4 rounded-3xl border border-slate-800 space-y-3" style="background:radial-gradient(circle at top, ${room.wallColor}, #020617);">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-white">${currentZone.name} — ${currentZone.desc}</span>
                                    <select onchange="window.State.avatar3d.animation=this.value; window.saveState()" class="bg-slate-900/90 border border-slate-700 rounded-lg px-2 py-1">
                                        ${KRG_DATA.animations.map(a => `<option value="${a}" ${window.State.avatar3d.animation===a?'selected':''}>Tư thế: ${a}</option>`).join("")}
                                    </select>
                                </div>
                                <div class="w-full h-80 rounded-2xl bg-black/30 border border-white/10 overflow-hidden">
                                    <canvas id="myroom-3d-canvas" class="w-full h-full block cursor-grab"></canvas>
                                </div>
                            </div>

                            <div class="lg:col-span-4 p-4 rounded-3xl bg-slate-900 border border-slate-800 space-y-3">
                                <h3 class="font-bold text-sm text-pink-400">🖼️ Album Ảnh Đã Chụp (${photos.length})</h3>
                                <div class="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto">
                                    ${photos.map((src, i) => `
                                        <div class="relative rounded-xl overflow-hidden border border-slate-700 group">
                                            <img src="${src}" class="w-full h-28 object-cover" alt="Studio Photo">
                                            <button onclick="window.State.user.avatarUrl='${src}'; window.saveState(); App.updateHeaderWidgets(); App.toast('Đã đặt làm ảnh đại diện!','success')" class="absolute bottom-1 inset-x-1 py-1 rounded bg-black/75 text-[10px] text-emerald-300 font-bold">Đặt Avatar</button>
                                        </div>
                                    `).join("") || `<div class="col-span-2 text-slate-500">Nhấn "Chụp Ảnh Photo Studio" để lưu ảnh kỷ niệm của nhân vật 3D & thú cưng!</div>`}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                setTimeout(() => ThreeEngine.mountScene("myroom-3d-canvas", "dual"), 60);
            },

            switchWorldZone(zoneId) {
                const z = KRG_DATA.worldZones.find(x => x.id === zoneId);
                if (!z) return;
                window.State.room.zoneId = z.id;
                window.State.room.wallColor = z.wall;
                window.State.room.floorColor = z.floor;
                window.State.room.lightColor = z.light;
                window.saveState();
                this.renderTab("myroom");
            },

            captureStudioPhoto() {
                const snap = ThreeEngine.captureAvatarSnapshot("myroom-3d-canvas");
                if (!snap) return;
                window.State.room.photos.unshift(snap);
                window.saveState();
                this.renderTab("myroom");
                this.toast("📸 Đã lưu ảnh kỷ niệm vào Album Photo Studio!", "success");
            }
        };

        window.addEventListener("DOMContentLoaded", () => {
            window.App.init();
        });
    </script>
</body>
</html>
